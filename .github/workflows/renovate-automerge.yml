name: Renovate auto-merge

on:
    pull_request_target:
        types: [opened, reopened, synchronize, ready_for_review]

jobs:
    automerge:
        if: >-
            github.event.pull_request.user.login == 'renovate[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.base.ref == github.event.repository.default_branch &&
            !github.event.pull_request.draft
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
        env:
            PR_NUMBER: ${{ github.event.pull_request.number }}
            PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        steps:
            -   name: Approve Renovate PR
                env:
                    GH_TOKEN: ${{ github.token }}
                run: |
                    gh api --method POST "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
                        -f event=APPROVE -f "commit_id=$PR_HEAD_SHA" --silent

            -   name: Enable auto-merge
                env:
                    # Renovate can update workflow files, which requires Workflows write permission.
                    GH_TOKEN: ${{ secrets.RENOVATE_AUTOMERGE_TOKEN }}
                run: |
                    : "${GH_TOKEN:?Set the RENOVATE_AUTOMERGE_TOKEN repository secret}"
                    gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
                        --auto --merge --match-head-commit "$PR_HEAD_SHA"
